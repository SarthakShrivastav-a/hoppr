name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not an afterthought here — the key-permission handling is
        # ACL-based and only exercised there, so it is a first-class CI target.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Verify modules
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Format
        run: gofmt -l . && test -z "$(gofmt -l .)"
        shell: bash

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o hoppr ./cmd/hoppr

      - name: Smoke test
        run: ./hoppr --version
