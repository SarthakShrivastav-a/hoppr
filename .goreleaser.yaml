version: 2

project_name: hoppr

before:
  hooks:
    - go mod tidy

builds:
  - id: hoppr
    main: ./cmd/hoppr
    binary: hoppr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: hoppr
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^merge:"

brews:
  - name: hoppr
    description: "An SSH session manager for the terminal."
    homepage: "https://github.com/SarthakShrivastav-a/hoppr"
    license: "MIT"
    repository:
      owner: SarthakShrivastav-a
      name: homebrew-tap
    directory: Formula
    install: |
      bin.install "hoppr"
    test: |
      system "#{bin}/hoppr", "--version"

scoops:
  - name: hoppr
    description: "An SSH session manager for the terminal."
    homepage: "https://github.com/SarthakShrivastav-a/hoppr"
    license: "MIT"
    repository:
      owner: SarthakShrivastav-a
      name: scoop-bucket

release:
  # Publish directly rather than as a draft, so `go install ...@latest`, the
  # Releases page, and the brew/scoop publishers all see the tag immediately.
  draft: false
  prerelease: auto
  name_template: "hoppr {{.Version}}"
  header: |
    ## hoppr {{.Tag}}

    An SSH session manager for the terminal. Edits your real ssh_config in
    place, finds the keys scattered around your disk, and tells you what is
    about to break.

    Install:

    ```bash
    go install github.com/SarthakShrivastav-a/hoppr/cmd/hoppr@{{.Tag}}
    ```

    Or download a binary below.
